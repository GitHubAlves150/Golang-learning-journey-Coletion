version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: crud-postgres
    restart: always
    environment:
      POSTGRES_USER: lucas_user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgress_for_crud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
